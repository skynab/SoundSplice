name: CI

# Builds, tests and packages SoundSplice on Windows, Linux and macOS.
#
#   - Every push to dev/main and every pull request: build + test, and upload
#     each platform's package as a workflow artifact (Actions run > Artifacts).
#   - A pushed tag named v* (e.g. v0.1.0): the same, then a GitHub Release is
#     created for the tag with all three packages and their checksums. The tag
#     must match project(VERSION) in CMakeLists.txt, which is what the app shows.
#   - Run workflow (workflow_dispatch): a manual build of any branch.

on:
  push:
    branches: [ dev, main ]
    tags: [ "v*" ]
    # Path filters are not applied to tag pushes, so a release always builds.
    paths-ignore: [ "docs/**", "**.md", "LICENSE", ".github/dependabot.yml" ]
  pull_request:
    paths-ignore: [ "docs/**", "**.md", "LICENSE", ".github/dependabot.yml" ]
  workflow_dispatch:

# A newer push to the same branch or PR supersedes a build still running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, platform: windows-x64 }
          # The oldest supported Ubuntu, so the binary runs on any distro with
          # glibc 2.35 or later rather than only the newest.
          - { name: Linux,   os: ubuntu-22.04,   platform: linux-x64 }
          - { name: macOS,   os: macos-latest,   platform: macos-arm64 }

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      # Build for macOS 12 and later rather than only the runner's own version.
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # Tag builds are named after the tag; everything else after the commit.
      # Checked first so a mistagged release fails in seconds, not after a build.
      - name: Package name
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
            project_version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -n1)
            if [[ "$version" != "v$project_version" && "$version" != "v$project_version-"* ]]; then
              echo "::error::Tag $version does not match project(VERSION $project_version) in CMakeLists.txt"
              exit 1
            fi
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "package=SoundSplice-${version}-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-12 ninja-build \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev \
            xvfb
          # 22.04's default GCC 11 has gaps in C++20; 12 is the newest it ships.
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          command -v ninja || choco install ninja -y --no-progress
          # The runner also has MinGW's gcc on PATH; make sure CMake takes MSVC.
          echo "CC=cl" >> "$GITHUB_ENV"
          echo "CXX=cl" >> "$GITHUB_ENV"

      # Ninja needs cl.exe on PATH, which the Visual Studio generator found itself.
      # Runs Visual Studio's own vcvars64.bat and carries over what it changed
      # (PATH, INCLUDE, LIB, ...) - ilammy/msvc-dev-cmd did this, but is
      # unmaintained and still on the deprecated Node 20 runtime.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw "No Visual Studio with the x64 C++ tools found" }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }

      # The CPM-downloaded sources (JUCE, Catch2, whisper.cpp, codecs, ...).
      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: cpm-${{ runner.os }}-

      # Compiled objects, so a push rebuilds only what it changed rather than
      # all of JUCE and whisper.cpp. PR builds start from dev's cache.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.platform }}
          max-size: 1G

      # Ninja on every platform: the Visual Studio generator compiles a
      # project's files one at a time, Ninja keeps every core busy.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      # The GUI tests create components, which on Linux needs an X display.
      - name: Test
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi

      - name: Package
        run: |
          pkg="${{ steps.meta.outputs.package }}"
          app=build/src/app/SoundSplice_artefacts/Release
          cli=build/tools/cli/soundsplice_cli_artefacts/Release
          mkdir -p dist "stage/$pkg"
          cp LICENSE README.md "stage/$pkg/"

          case "$RUNNER_OS" in
            Windows)
              cp "$app/SoundSplice.exe" "$cli/soundsplice-cli.exe" "stage/$pkg/"
              (cd stage && 7z a -tzip "../dist/$pkg.zip" "$pkg")
              ;;
            Linux)
              cp "$app/SoundSplice" "$cli/soundsplice-cli" "stage/$pkg/"
              strip --strip-unneeded "stage/$pkg/SoundSplice" "stage/$pkg/soundsplice-cli"
              tar -C stage -czf "dist/$pkg.tar.gz" "$pkg"
              ;;
            macOS)
              cp -R "$app/SoundSplice.app" "$cli/soundsplice-cli" "stage/$pkg/"
              # Apple Silicon refuses to run unsigned code; an ad-hoc signature
              # is enough to launch (after right-click > Open, as it isn't
              # notarized).
              codesign --force --deep --sign - "stage/$pkg/SoundSplice.app"
              codesign --force --sign - "stage/$pkg/soundsplice-cli"
              ln -s /Applications "stage/$pkg/Applications"
              # hdiutil intermittently fails with "Resource busy" on hosted runners.
              for attempt in 1 2 3 4 5; do
                hdiutil create -volname SoundSplice -srcfolder "stage/$pkg" \
                  -fs HFS+ -format UDZO -ov "dist/$pkg.dmg" && break
                [[ $attempt == 5 ]] && exit 1
                sleep 10
              done
              ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.package }}
          path: dist/*
          if-no-files-found: error
          # Tag builds are kept on the Release itself; dev builds pile up fast.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # A re-run of a tag's workflow replaces the assets on the existing release.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "SoundSplice $GITHUB_REF_NAME" \
              --generate-notes \
              $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
          fi
